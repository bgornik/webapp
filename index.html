<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Izbirnik čaja</title>
  <!-- The manifest is what lets a phone install the page as an app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#d97706">
  <style>
    :root {
      color-scheme: light dark;
      --border: #c9ccd1;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #b91c1c;
      --trim: #d97706; /* wheel rim and the border of the "Čaj dneva" sign: one colour, one thickness */
      --trim-width: 6px;
      --spin-a: #2563eb; /* the spin button drifts slowly through these three */
      --spin-b: #7c3aed;
      --spin-c: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --border: #3f434a;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --danger: #f87171;
        --spin-a: #60a5fa;
        --spin-b: #a78bfa;
        --spin-c: #2dd4bf;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    main { max-width: 32rem; margin: 0 auto; }
    header { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.75rem; }
    /* A teapot heads the page, with steam drifting up from its spout. */
    .teapot { width: 4.5rem; height: 4.5rem; overflow: visible; }
    .pot-body { fill: #f59e0b; }
    .pot-dark { fill: #d97706; }
    .pot-handle { fill: none; stroke: #d97706; stroke-width: 4; stroke-linecap: round; }
    .pot-shine { fill: none; stroke: #fef3c7; stroke-width: 2; stroke-linecap: round; }
    .pot-steam {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.6;
      stroke-linecap: round;
      opacity: 0;
      animation: steam 2.8s ease-out infinite;
    }
    .pot-steam + .pot-steam { animation-delay: 1.4s; }
    @keyframes steam {
      0% { transform: translateY(3px); opacity: 0; }
      30% { opacity: 0.9; }
      100% { transform: translateY(-5px); opacity: 0; }
    }
    h2 { margin: 0; font-size: 1.25rem; }
    form { display: flex; gap: 0.5rem; }
    input, button {
      font: inherit;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    input { flex: 1; min-width: 0; }
    button { cursor: pointer; white-space: nowrap; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) {
      button.primary { color: #0b1220; }
    }
    button.danger { color: var(--danger); }
    #error { color: var(--danger); margin: 0.5rem 0 0; }
    #empty { color: var(--muted); margin: 0; padding: 0.75rem 1.25rem 1.25rem; }
    ul { list-style: none; margin: 0; padding: 0 1.25rem; }
    ul:not(:empty) { padding-bottom: 0.75rem; }
    li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    li .text { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; white-space: pre-wrap; }
    li form { flex: 1; min-width: 0; }
    #wheel { text-align: center; }
    /* The rim is the picture's own round border, so it is exactly as thick as the sign's border.
       The picture ends at the slices' edge; the pointer and the winner's outline spill over the rim. */
    #wheel svg {
      display: block;
      width: min(100%, 24rem);
      margin: 0 auto;
      border: var(--trim-width) solid var(--trim);
      border-radius: 50%;
      overflow: visible;
    }
    #wheel-spin { transform-box: fill-box; transform-origin: center; }
    #wheel-spin path, #wheel-spin circle { stroke: #fff; stroke-width: 0.6; }
    #wheel-spin circle.empty { fill: var(--border); }
    #wheel-spin path.winner, #wheel-spin circle.winner { stroke: #facc15; stroke-width: 3; stroke-linejoin: round; }
    /* The chosen slice blinks: its colour and its label's colour swap, then swap back. */
    #wheel-spin .winner { animation: blink-slice 1.2s step-end infinite; }
    #wheel-spin .winner-label { animation: blink-label 1.2s step-end infinite; }
    @keyframes blink-slice { 50% { fill: #fff; } }
    @keyframes blink-label { 50% { fill: var(--slice); } }
    #wheel-spin text { fill: #fff; font-weight: 600; white-space: pre; }
    #wheel .hub { fill: #fff; stroke: #1f2937; stroke-width: 1.5; }
    #wheel .pointer { fill: #1f2937; stroke: #fff; stroke-width: 1; stroke-linejoin: round; }
    #spin-button {
      margin-top: 1.5rem;
      padding: 0.7rem 1.6rem;
      font-size: 1.15rem;
      font-weight: 600;
      animation: glow 4.5s ease-in-out infinite;
    }
    #spin-button:disabled { opacity: 0.6; cursor: default; animation-play-state: paused; }
    @keyframes glow {
      0%, 100% { background-color: var(--spin-a); border-color: var(--spin-a); }
      33% { background-color: var(--spin-b); border-color: var(--spin-b); }
      66% { background-color: var(--spin-c); border-color: var(--spin-c); }
    }
    #hint { color: var(--muted); margin: 1rem 0 0; }
    #edit-teas { display: block; margin: 1.5rem auto 0; }
    #result {
      margin: 1.5rem 0 0;
      padding: 1.25rem 1rem;
      border: var(--trim-width) solid var(--trim);
      border-radius: 12px;
      background: #fef3c7;
      color: #78350f;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    /* Three lines: the date, "Čaj dneva:", then the tea. */
    #result-date { display: block; font-size: 0.6em; }
    #result strong { display: block; }
    #result.waiting { visibility: hidden; }
    /* The tea list lives in a dialog pinned near the top of the window, so its add field stays
       clear of a phone's on-screen keyboard. The title and add field stay put while the list scrolls. */
    dialog {
      width: min(32rem, calc(100% - 1.5rem));
      max-width: none;
      max-height: calc(100% - 3rem);
      margin: 1.5rem auto auto;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.5); }
    html:has(dialog[open]) { overflow: hidden; } /* the page behind must not scroll */
    .sheet-top { position: sticky; top: 0; z-index: 1; padding: 1rem 1.25rem 0.75rem; background: Canvas; }
    .sheet-title { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>
  <main>
    <header>
      <svg class="teapot" viewBox="0 0 64 64" aria-hidden="true">
        <path class="pot-steam" d="M55 26 q-3 -3.5 0 -7 q3 -3.5 0 -7"/>
        <path class="pot-steam" d="M60 27 q-3 -3.5 0 -7 q3 -3.5 0 -7"/>
        <path class="pot-handle" d="M15 33 C3 31 3 51 16 50"/>
        <path class="pot-body" d="M43 39 C50 38 49 33 53 30 L58.5 34 C54 37 56 46 45 50 Z"/>
        <ellipse class="pot-body" cx="30" cy="42.5" rx="17" ry="15.5"/>
        <ellipse class="pot-dark" cx="30" cy="57.5" rx="11" ry="2.5"/>
        <path class="pot-dark" d="M18.5 30 Q30 19 41.5 30 Q30 33 18.5 30 Z"/>
        <circle class="pot-dark" cx="30" cy="23" r="2.8"/>
        <path class="pot-shine" d="M18 42 C19 36 23 33.5 27 33.5"/>
      </svg>
    </header>
    <div id="wheel">
      <svg viewBox="-96 -96 192 192" role="img" aria-label="Vrteče se kolo z enim poljem za vsak čaj">
        <g id="wheel-spin"></g>
        <circle class="hub" r="7"/>
        <polygon class="pointer" points="-6,-100 6,-100 0,-86"/>
      </svg>
      <button id="spin-button" type="button" class="primary">ZAVRTI KOLOČAJ</button>
      <p id="hint" hidden>Kolo je prazno. Čaje dodaš z gumbom »Seznam čajev«.</p>
      <p id="result" role="status" hidden><span id="result-date"></span> Čaj dneva: <strong id="result-name"></strong></p>
    </div>
    <button id="edit-teas" type="button" aria-haspopup="dialog">Seznam čajev</button>
  </main>
  <dialog id="teas-dialog" aria-labelledby="teas-title">
    <div class="sheet-top">
      <div class="sheet-title">
        <h2 id="teas-title">Čaji</h2>
        <button id="close-teas" type="button">Zapri</button>
      </div>
      <form id="add-form">
        <input id="add-input" type="text" maxlength="20" placeholder="Dodaj čaj (največ 20 znakov)" aria-label="Nov čaj" autocomplete="off">
        <button type="submit" class="primary">Dodaj</button>
      </form>
      <p id="error" role="alert" hidden></p>
    </div>
    <ul id="list"></ul>
    <p id="empty" hidden>Čajev še ni.</p>
  </dialog>
  <script>
    // localStorage is shared by every site under bgornik.github.io, so the key is namespaced.
    // It predates the rename to a tea picker and is kept so saved lists survive.
    const STORAGE_KEY = 'webapp.strings';
    const WINNER_KEY = 'webapp.winner'; // the current tea of the day and the day it was picked
    const SAVE_ERROR = 'Shranjevanje ni uspelo: shramba brskalnika ni na voljo ali je polna.';
    const MAX_LENGTH = 20;

    const addForm = document.getElementById('add-form');
    const addInput = document.getElementById('add-input');
    const errorEl = document.getElementById('error');
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const teasDialog = document.getElementById('teas-dialog');
    const hintEl = document.getElementById('hint');
    const wheelEl = document.getElementById('wheel');
    const spinEl = document.getElementById('wheel-spin');
    const spinButton = document.getElementById('spin-button');
    const resultEl = document.getElementById('result');
    const resultNameEl = document.getElementById('result-name');
    const resultDateEl = document.getElementById('result-date');

    // Wheel geometry, in the SVG's own units (the viewBox is centred on 0,0 and ends at the slices' edge).
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const WHEEL_RADIUS = 96;
    const LABEL_OUTER = 92;
    const LABEL_MAX_LENGTH = 78;
    const LABEL_SIZE = 10;
    // All dark enough for white label text.
    const WHEEL_COLORS = ['#be123c', '#1d4ed8', '#047857', '#b45309', '#6d28d9', '#0e7490', '#a21caf', '#4d7c0f'];

    const IDLE_TURN_MS = 40000;
    const SPIN_MS = 6000;
    const SPIN_TURNS = 6;
    const SPIN_EASING = 'cubic-bezier(0.2, 0.4, 0.1, 1)';
    const NUDGE_MS = 900;
    const HOLD_MS = 6000; // how long the wheel rests on the winner before idling again
    const CONFETTI_MS = 3500;
    const CONFETTI_COUNT = 180;
    const DATE_FORMAT = new Intl.DateTimeFormat('sl', { weekday: 'short', day: 'numeric', month: 'short' }); // "pon., 12. okt."
    const CONFETTI_COLORS = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#facc15'];

    let items = load();
    let editingId = null;
    let winnerId = null;
    let winnerDay = null; // the day it was picked, as YYYY-MM-DD; this is the date the sign shows
    loadWinner();
    let avoidName = null; // while spinning: the current tea of the day, which must not win again
    let spinning = false;
    let wheelAngle = 0; // degrees clockwise, where the wheel rests when nothing is animating it
    let wheelAnimation = null;
    let idleTimer = null;

    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(item => item && typeof item.id === 'string' && typeof item.text === 'string');
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch {
        showError(SAVE_ERROR);
      }
    }

    // Reads the saved pick into winnerId and winnerDay. It is saved as {"id": "...", "day": "2026-10-12"};
    // earlier versions saved the bare id, which loads as a pick whose day is unknown.
    function loadWinner() {
      winnerId = null;
      winnerDay = null;
      let raw = null;
      try {
        raw = localStorage.getItem(WINNER_KEY);
      } catch {
        return;
      }
      if (raw === null) return;
      let saved = { id: raw };
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') saved = parsed;
      } catch {
        // not JSON: the old bare-id format
      }
      if (!items.some(item => item.id === saved.id)) return;
      winnerId = saved.id;
      winnerDay = parseDay(saved.day) ? saved.day : null;
    }

    function saveWinner() {
      try {
        if (winnerId) localStorage.setItem(WINNER_KEY, JSON.stringify({ id: winnerId, day: winnerDay }));
        else localStorage.removeItem(WINNER_KEY);
      } catch {
        showError(SAVE_ERROR);
      }
    }

    // Today on this device's calendar, as YYYY-MM-DD.
    function today() {
      const now = new Date();
      const pad = number => String(number).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    // A saved YYYY-MM-DD day as a local date, or null if it is missing or not a real date.
    function parseDay(day) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day);
      if (!match) return null;
      const date = new Date(+match[1], match[2] - 1, +match[3]);
      return date.getMonth() === match[2] - 1 && date.getDate() === +match[3] ? date : null;
    }

    // How a tea reads on the sign. Two teas that read the same there count as the same tea.
    function signName(item) {
      return item.text.toLocaleUpperCase('sl');
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    // Returns the cleaned string, or null after showing why it was rejected.
    function validate(raw) {
      const text = raw.trim();
      if (!text) {
        showError('Vnesi vsaj en znak.');
        return null;
      }
      if (text.length > MAX_LENGTH) {
        showError(`Ime čaja ima lahko največ ${MAX_LENGTH} znakov.`);
        return null;
      }
      showError('');
      return text;
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function button(label, className, onClick) {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = label;
      if (className) el.className = className;
      el.addEventListener('click', onClick);
      return el;
    }

    function renderItem(item) {
      const li = document.createElement('li');
      li.dataset.id = item.id;

      if (item.id === editingId) {
        const form = document.createElement('form');
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = MAX_LENGTH;
        input.value = item.text;
        input.setAttribute('aria-label', 'Uredi čaj');
        input.autocomplete = 'off';
        input.addEventListener('keydown', event => {
          if (event.key !== 'Escape') return;
          event.preventDefault(); // cancel just this edit; otherwise Escape would also close the dialog
          stopEditing();
        });

        const saveButton = document.createElement('button');
        saveButton.type = 'submit';
        saveButton.className = 'primary';
        saveButton.textContent = 'Shrani';

        form.append(input, saveButton, button('Prekliči', '', stopEditing));
        form.addEventListener('submit', event => {
          event.preventDefault();
          const text = validate(input.value);
          if (text === null) return;
          item.text = text;
          save();
          stopEditing();
        });
        li.append(form);
        return li;
      }

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = item.text;
      li.append(
        text,
        button('Uredi', '', () => startEditing(item.id)),
        button('Izbriši', 'danger', () => remove(item.id)),
      );
      return li;
    }

    function svgEl(name, attrs) {
      const el = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      return el;
    }

    function sliceColor(index, count) {
      // Stops the last slice matching the first one it wraps round to.
      const wraps = count > 1 && index === count - 1 && index % WHEEL_COLORS.length === 0;
      return WHEEL_COLORS[wraps ? 1 : index % WHEEL_COLORS.length];
    }

    // Only the contents of the spinning group are replaced, so the rotation never restarts.
    // Also keeps the spin button and the "Čaj dneva" sign in step with the list.
    function renderWheel() {
      const count = items.length;
      const step = 2 * Math.PI / count;
      const point = angle => `${(WHEEL_RADIUS * Math.cos(angle)).toFixed(3)} ${(WHEEL_RADIUS * Math.sin(angle)).toFixed(3)}`;

      const slices = [];
      const labels = [];
      let winnerSlice = null;
      items.forEach((item, index) => {
        const start = index * step - Math.PI / 2; // the first slice starts at 12 o'clock
        const fill = sliceColor(index, count);
        const slice = count === 1
          ? svgEl('circle', { r: WHEEL_RADIUS, fill })
          : svgEl('path', { fill, d: `M0 0L${point(start)}A${WHEEL_RADIUS} ${WHEEL_RADIUS} 0 0 1 ${point(start + step)}Z` });
        if (item.id === winnerId) {
          slice.classList.add('winner');
          winnerSlice = slice;
        } else {
          slices.push(slice);
        }

        const label = svgEl('text', {
          x: LABEL_OUTER,
          'text-anchor': 'end',
          'dominant-baseline': 'central',
          'font-size': LABEL_SIZE,
          transform: `rotate(${(start + step / 2) * 180 / Math.PI})`,
        });
        label.textContent = item.text;
        if (item.id === winnerId) {
          label.classList.add('winner-label');
          label.style.setProperty('--slice', fill); // the colour its text takes when the slice blinks white
        }
        labels.push(label);
      });
      // With no teas the wheel stays in place as a blank disc, so the page does not jump when the first is added.
      if (count === 0) slices.push(svgEl('circle', { r: WHEEL_RADIUS, class: 'empty' }));
      // The winner is drawn last so its outline sits on top of its neighbours.
      if (winnerSlice) slices.push(winnerSlice);
      spinEl.replaceChildren(...slices, ...labels);

      // Shrink each label until it fits along the radius and inside its slice's width
      // at the end nearest the hub, where the slice is narrowest.
      const widthFactor = 2 * Math.sin(Math.PI / count) * 0.9;
      for (const label of labels) {
        const length = label.getComputedTextLength();
        if (!length) continue;
        let scale = Math.min(1, LABEL_MAX_LENGTH / length);
        if (count > 2) scale = Math.min(scale, widthFactor * LABEL_OUTER / (LABEL_SIZE + widthFactor * length));
        label.setAttribute('font-size', (LABEL_SIZE * scale).toFixed(2));
      }

      spinButton.disabled = spinning || count === 0;
      hintEl.hidden = count > 0;
      // During a spin the previous sign is blanked but keeps its place and size, so the button
      // below it does not jump up and back down.
      resultEl.classList.toggle('waiting', spinning);
      if (spinning) return;
      const winner = items.find(item => item.id === winnerId);
      resultEl.hidden = !winner;
      // The sign shouts the name; the stored tea and its wheel label keep their own case.
      resultNameEl.textContent = winner ? signName(winner) : '';
      // The date is the day the tea was picked, not today; a pick saved without one shows no date.
      const pickedOn = winner ? parseDay(winnerDay) : null;
      resultDateEl.textContent = pickedOn ? DATE_FORMAT.format(pickedOn) : '';
    }

    function setWheelAngle(angle) {
      wheelAngle = angle % 360;
      spinEl.style.transform = `rotate(${wheelAngle}deg)`;
    }

    function startIdle() {
      if (spinning || wheelAnimation) return;
      wheelAnimation = spinEl.animate(
        { transform: [`rotate(${wheelAngle}deg)`, `rotate(${wheelAngle + 360}deg)`] },
        { duration: IDLE_TURN_MS, iterations: Infinity },
      );
    }

    // Freezes the idle rotation where it currently is.
    function stopIdle() {
      clearTimeout(idleTimer);
      if (!wheelAnimation) return;
      const progress = wheelAnimation.effect.getComputedTiming().progress || 0;
      wheelAnimation.cancel();
      wheelAnimation = null;
      setWheelAngle(wheelAngle + 360 * progress);
    }

    function canWin(item) {
      return signName(item) !== avoidName;
    }

    // The rotation, at or just past the current one, that puts a spot of the given slice under the pointer.
    function angleToSlice(index, spot) {
      const landing = (index + spot) * 360 / items.length;
      return wheelAngle + ((360 - landing - wheelAngle) % 360 + 360) % 360;
    }

    // Turns the wheel clockwise to the given rotation, then settles the result.
    function rotateTo(target, duration) {
      wheelAnimation = spinEl.animate(
        { transform: [`rotate(${wheelAngle}deg)`, `rotate(${target}deg)`] },
        { duration, easing: SPIN_EASING, fill: 'forwards' },
      );
      wheelAnimation.onfinish = () => land(target);
    }

    function spinWheel() {
      if (spinning || items.length === 0) return;
      stopIdle();
      const current = items.find(item => item.id === winnerId);
      avoidName = current ? signName(current) : null;
      spinning = true;
      winnerId = null; // drops the highlight for the spin; the saved pick is only replaced on landing
      renderWheel();

      // Pick any tea but the current one, then a spot inside its slice (away from the edges).
      const others = items.filter(canWin);
      const pool = others.length ? others : items; // a lone tea can only win again
      const index = items.indexOf(pool[Math.floor(Math.random() * pool.length)]);
      rotateTo(angleToSlice(index, 0.15 + Math.random() * 0.7) + SPIN_TURNS * 360, SPIN_MS);
    }

    function land(angle) {
      setWheelAngle(angle);
      if (wheelAnimation) wheelAnimation.cancel();
      wheelAnimation = null;

      // Whatever sits under the pointer wins, so the result is right even if the list changed mid-spin.
      const count = items.length;
      const index = Math.min(Math.floor(((360 - wheelAngle) % 360) / (360 / count)), count - 1);
      // If such a change left the current tea under the pointer, roll on to the next one that may win.
      if (count && !canWin(items[index]) && items.some(canWin)) {
        let next = index;
        do next = (next - 1 + count) % count; while (!canWin(items[next]));
        rotateTo(angleToSlice(next, 0.5), NUDGE_MS);
        return;
      }

      spinning = false;
      const winner = items[index];
      winnerId = winner ? winner.id : null;
      winnerDay = winner ? today() : null;
      saveWinner();
      renderWheel();
      if (winner) {
        resultEl.animate(
          [{ transform: 'scale(0.6)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }],
          { duration: 500, easing: 'cubic-bezier(0.2, 1.4, 0.4, 1)' },
        );
        celebrate();
        // Measured on the container: the sign itself is mid pop-in and reports a smaller box.
        if (wheelEl.getBoundingClientRect().bottom > window.innerHeight) {
          wheelEl.scrollIntoView({ block: 'end', behavior: 'smooth' });
        }
      }
      idleTimer = setTimeout(startIdle, HOLD_MS);
    }

    // Bursts confetti out of the middle of the wheel on a throwaway full-window canvas.
    function celebrate() {
      document.querySelectorAll('.confetti').forEach(el => el.remove());

      const canvas = document.createElement('canvas');
      canvas.className = 'confetti';
      const ratio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      document.body.append(canvas);
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);

      const box = wheelEl.querySelector('svg').getBoundingClientRect();
      const originX = box.left + box.width / 2;
      const originY = Math.min(Math.max(box.top + box.height / 2, window.innerHeight * 0.2), window.innerHeight * 0.7);
      const pieces = Array.from({ length: CONFETTI_COUNT }, () => {
        const direction = Math.random() * 2 * Math.PI;
        const speed = 3 + Math.random() * 11;
        return {
          x: originX,
          y: originY,
          vx: Math.cos(direction) * speed,
          vy: Math.sin(direction) * speed - 6,
          size: 6 + Math.random() * 7,
          tilt: Math.random() * Math.PI,
          twirl: (Math.random() - 0.5) * 0.5,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        };
      });

      const started = performance.now();
      let previous = started;
      function frame(now) {
        const elapsed = now - started;
        if (elapsed >= CONFETTI_MS || !canvas.isConnected) {
          canvas.remove();
          return;
        }
        const ticks = Math.min((now - previous) / 16.7, 3);
        previous = now;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.globalAlpha = Math.min(1, (CONFETTI_MS - elapsed) / 700);
        for (const piece of pieces) {
          piece.vy += 0.28 * ticks;
          piece.vx *= 0.985 ** ticks;
          piece.x += piece.vx * ticks;
          piece.y += piece.vy * ticks;
          piece.tilt += piece.twirl * ticks;
          ctx.save();
          ctx.translate(piece.x, piece.y);
          ctx.rotate(piece.tilt);
          ctx.fillStyle = piece.color;
          ctx.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
          ctx.restore();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function render() {
      listEl.replaceChildren(...items.map(renderItem));
      emptyEl.hidden = items.length > 0;
      renderWheel();
      const editInput = listEl.querySelector('li form input');
      if (editInput) {
        editInput.focus();
        editInput.select();
      }
    }

    function startEditing(id) {
      editingId = id;
      showError('');
      render();
    }

    function stopEditing() {
      editingId = null;
      showError('');
      render();
    }

    function remove(id) {
      items = items.filter(item => item.id !== id);
      if (editingId === id) editingId = null;
      if (winnerId === id) {
        winnerId = null;
        winnerDay = null;
        saveWinner();
      }
      save();
      render();
    }

    addForm.addEventListener('submit', event => {
      event.preventDefault();
      const text = validate(addInput.value);
      if (text === null) return;
      items.unshift({ id: newId(), text });
      save();
      addInput.value = '';
      render();
      addInput.focus();
    });

    // Keep other open tabs of this page in step.
    window.addEventListener('storage', event => {
      if (event.key !== STORAGE_KEY && event.key !== WINNER_KEY && event.key !== null) return;
      items = load();
      if (!spinning) loadWinner();
      if (!items.some(item => item.id === editingId)) editingId = null;
      render();
    });

    spinButton.addEventListener('click', spinWheel);

    document.getElementById('edit-teas').addEventListener('click', () => {
      stopEditing(); // start clean: no half-finished edit or old error left from last time
      teasDialog.showModal();
    });
    document.getElementById('close-teas').addEventListener('click', () => teasDialog.close());
    // A click on the dimmed backdrop lands on the dialog element itself. The press must start there
    // too, so dragging a text selection out of the add field does not close the dialog.
    let pressedBackdrop = false;
    teasDialog.addEventListener('pointerdown', event => {
      pressedBackdrop = event.target === teasDialog;
    });
    teasDialog.addEventListener('click', event => {
      if (pressedBackdrop && event.target === teasDialog) teasDialog.close();
    });

    render();
    startIdle();

    // Keeps a copy of the page for when there is no connection (see sw.js). The page works without it.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
