<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tea picker</title>
  <style>
    :root {
      color-scheme: light dark;
      --border: #c9ccd1;
      --muted: #6b7280;
      --accent: #2563eb;
      --danger: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --border: #3f434a;
        --muted: #9ca3af;
        --accent: #60a5fa;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    main { max-width: 32rem; margin: 0 auto; }
    h1 { margin: 0 0 1rem; }
    form { display: flex; gap: 0.5rem; }
    input, button {
      font: inherit;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    input { flex: 1; min-width: 0; }
    button { cursor: pointer; white-space: nowrap; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) {
      button.primary { color: #0b1220; }
    }
    button.danger { color: var(--danger); }
    #error { color: var(--danger); margin: 0.5rem 0 0; }
    #empty { color: var(--muted); }
    ul { list-style: none; margin: 1rem 0 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
    }
    li .text { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    li form { flex: 1; min-width: 0; }
    #wheel { text-align: center; }
    #wheel svg { display: block; width: min(100%, 24rem); margin: 2rem auto 0; }
    #wheel-spin { transform-box: fill-box; transform-origin: center; }
    #wheel-spin path, #wheel-spin circle { stroke: #fff; stroke-width: 0.6; }
    #wheel-spin path.winner, #wheel-spin circle.winner { stroke: #facc15; stroke-width: 3; stroke-linejoin: round; }
    #wheel-spin text { fill: #fff; font-weight: 600; white-space: pre; }
    #wheel .hub { fill: #fff; stroke: #1f2937; stroke-width: 1.5; }
    #wheel .pointer { fill: #1f2937; stroke: #fff; stroke-width: 1; stroke-linejoin: round; }
    #spin-button { margin-top: 1.5rem; padding: 0.7rem 1.6rem; font-size: 1.15rem; font-weight: 600; }
    #spin-button:disabled { opacity: 0.6; cursor: default; }
    #result {
      margin: 1.5rem 0 0;
      padding: 1.25rem 1rem;
      border: 3px solid #f59e0b;
      border-radius: 12px;
      background: #fef3c7;
      color: #78350f;
      font-size: clamp(1.5rem, 6vw, 2.25rem);
      font-weight: 700;
      line-height: 1.25;
      overflow-wrap: anywhere;
      animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
    }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    @media (prefers-reduced-motion: reduce) {
      #result { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tea picker</h1>
    <form id="add-form">
      <input id="add-input" type="text" maxlength="20" placeholder="Add a tea (max 20 characters)" aria-label="New tea" autocomplete="off">
      <button type="submit" class="primary">Add</button>
    </form>
    <p id="error" role="alert" hidden></p>
    <ul id="list"></ul>
    <p id="empty" hidden>No teas yet.</p>
    <div id="wheel" hidden>
      <svg viewBox="-100 -100 200 200" role="img" aria-label="Spinning wheel with one section per tea">
        <g id="wheel-spin"></g>
        <circle class="hub" r="7"/>
        <polygon class="pointer" points="-6,-100 6,-100 0,-86"/>
      </svg>
      <button id="spin-button" type="button" class="primary">Spin the wheel!</button>
      <p id="result" role="status" hidden>Tea of the day: <strong id="result-name"></strong></p>
    </div>
  </main>
  <script>
    // localStorage is shared by every site under bgornik.github.io, so the key is namespaced.
    // It predates the rename to "Tea picker" and is kept so saved lists survive.
    const STORAGE_KEY = 'webapp.strings';
    const MAX_LENGTH = 20;

    const addForm = document.getElementById('add-form');
    const addInput = document.getElementById('add-input');
    const errorEl = document.getElementById('error');
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const wheelEl = document.getElementById('wheel');
    const spinEl = document.getElementById('wheel-spin');
    const spinButton = document.getElementById('spin-button');
    const resultEl = document.getElementById('result');
    const resultNameEl = document.getElementById('result-name');

    // Wheel geometry, in the SVG's own units (the viewBox is 200 wide, centred on 0,0).
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const WHEEL_RADIUS = 96;
    const LABEL_OUTER = 92;
    const LABEL_MAX_LENGTH = 78;
    const LABEL_SIZE = 10;
    // All dark enough for white label text.
    const WHEEL_COLORS = ['#be123c', '#1d4ed8', '#047857', '#b45309', '#6d28d9', '#0e7490', '#a21caf', '#4d7c0f'];

    const IDLE_TURN_MS = 40000;
    const SPIN_MS = 6000;
    const SPIN_TURNS = 6;
    const SPIN_EASING = 'cubic-bezier(0.2, 0.4, 0.1, 1)';
    const HOLD_MS = 6000; // how long the wheel rests on the winner before idling again
    const CONFETTI_MS = 3500;
    const CONFETTI_COUNT = 180;
    const CONFETTI_COLORS = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#facc15'];
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    let items = load();
    let editingId = null;
    let winnerId = null;
    let spinning = false;
    let wheelAngle = 0; // degrees clockwise, where the wheel rests when nothing is animating it
    let wheelAnimation = null;
    let idleTimer = null;

    function load() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(item => item && typeof item.id === 'string' && typeof item.text === 'string');
      } catch {
        return [];
      }
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch {
        showError('Could not save: browser storage is unavailable or full.');
      }
    }

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    // Returns the cleaned string, or null after showing why it was rejected.
    function validate(raw) {
      const text = raw.trim();
      if (!text) {
        showError('Enter at least one character.');
        return null;
      }
      if (text.length > MAX_LENGTH) {
        showError(`Teas can be at most ${MAX_LENGTH} characters.`);
        return null;
      }
      showError('');
      return text;
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function button(label, className, onClick) {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = label;
      if (className) el.className = className;
      el.addEventListener('click', onClick);
      return el;
    }

    function renderItem(item) {
      const li = document.createElement('li');
      li.dataset.id = item.id;

      if (item.id === editingId) {
        const form = document.createElement('form');
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = MAX_LENGTH;
        input.value = item.text;
        input.setAttribute('aria-label', 'Edit tea');
        input.autocomplete = 'off';
        input.addEventListener('keydown', event => {
          if (event.key === 'Escape') stopEditing();
        });

        const saveButton = document.createElement('button');
        saveButton.type = 'submit';
        saveButton.className = 'primary';
        saveButton.textContent = 'Save';

        form.append(input, saveButton, button('Cancel', '', stopEditing));
        form.addEventListener('submit', event => {
          event.preventDefault();
          const text = validate(input.value);
          if (text === null) return;
          item.text = text;
          save();
          stopEditing();
        });
        li.append(form);
        return li;
      }

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = item.text;
      li.append(
        text,
        button('Edit', '', () => startEditing(item.id)),
        button('Delete', 'danger', () => remove(item.id)),
      );
      return li;
    }

    function svgEl(name, attrs) {
      const el = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attrs)) el.setAttribute(key, value);
      return el;
    }

    function sliceColor(index, count) {
      // Stops the last slice matching the first one it wraps round to.
      const wraps = count > 1 && index === count - 1 && index % WHEEL_COLORS.length === 0;
      return WHEEL_COLORS[wraps ? 1 : index % WHEEL_COLORS.length];
    }

    // Only the contents of the spinning group are replaced, so the rotation never restarts.
    // Also keeps the spin button and the "Tea of the day" sign in step with the list.
    function renderWheel() {
      const count = items.length;
      wheelEl.hidden = count === 0;
      const step = 2 * Math.PI / count;
      const point = angle => `${(WHEEL_RADIUS * Math.cos(angle)).toFixed(3)} ${(WHEEL_RADIUS * Math.sin(angle)).toFixed(3)}`;

      const slices = [];
      const labels = [];
      let winnerSlice = null;
      items.forEach((item, index) => {
        const start = index * step - Math.PI / 2; // the first slice starts at 12 o'clock
        const fill = sliceColor(index, count);
        const slice = count === 1
          ? svgEl('circle', { r: WHEEL_RADIUS, fill })
          : svgEl('path', { fill, d: `M0 0L${point(start)}A${WHEEL_RADIUS} ${WHEEL_RADIUS} 0 0 1 ${point(start + step)}Z` });
        if (item.id === winnerId) {
          slice.classList.add('winner');
          winnerSlice = slice;
        } else {
          slices.push(slice);
        }

        const label = svgEl('text', {
          x: LABEL_OUTER,
          'text-anchor': 'end',
          'dominant-baseline': 'central',
          'font-size': LABEL_SIZE,
          transform: `rotate(${(start + step / 2) * 180 / Math.PI})`,
        });
        label.textContent = item.text;
        labels.push(label);
      });
      // The winner is drawn last so its outline sits on top of its neighbours.
      if (winnerSlice) slices.push(winnerSlice);
      spinEl.replaceChildren(...slices, ...labels);

      // Shrink each label until it fits along the radius and inside its slice's width
      // at the end nearest the hub, where the slice is narrowest.
      const widthFactor = 2 * Math.sin(Math.PI / count) * 0.9;
      for (const label of labels) {
        const length = label.getComputedTextLength();
        if (!length) continue;
        let scale = Math.min(1, LABEL_MAX_LENGTH / length);
        if (count > 2) scale = Math.min(scale, widthFactor * LABEL_OUTER / (LABEL_SIZE + widthFactor * length));
        label.setAttribute('font-size', (LABEL_SIZE * scale).toFixed(2));
      }

      const winner = items.find(item => item.id === winnerId);
      spinButton.disabled = spinning;
      resultEl.hidden = !winner;
      resultNameEl.textContent = winner ? winner.text : '';
    }

    function setWheelAngle(angle) {
      wheelAngle = angle % 360;
      spinEl.style.transform = `rotate(${wheelAngle}deg)`;
    }

    function startIdle() {
      if (spinning || wheelAnimation || reducedMotion.matches) return;
      wheelAnimation = spinEl.animate(
        { transform: [`rotate(${wheelAngle}deg)`, `rotate(${wheelAngle + 360}deg)`] },
        { duration: IDLE_TURN_MS, iterations: Infinity },
      );
    }

    // Freezes the idle rotation where it currently is.
    function stopIdle() {
      clearTimeout(idleTimer);
      if (!wheelAnimation) return;
      const progress = wheelAnimation.effect.getComputedTiming().progress || 0;
      wheelAnimation.cancel();
      wheelAnimation = null;
      setWheelAngle(wheelAngle + 360 * progress);
    }

    function spinWheel() {
      if (spinning || items.length === 0) return;
      stopIdle();
      spinning = true;
      winnerId = null;
      renderWheel();

      // Pick a slice, then a spot inside it (away from its edges) to bring under the pointer.
      const step = 360 / items.length;
      const index = Math.floor(Math.random() * items.length);
      const landing = (index + 0.15 + Math.random() * 0.7) * step;
      const target = wheelAngle + SPIN_TURNS * 360 + ((360 - landing - wheelAngle) % 360 + 360) % 360;

      if (reducedMotion.matches) {
        land(target);
        return;
      }
      wheelAnimation = spinEl.animate(
        { transform: [`rotate(${wheelAngle}deg)`, `rotate(${target}deg)`] },
        { duration: SPIN_MS, easing: SPIN_EASING, fill: 'forwards' },
      );
      wheelAnimation.onfinish = () => land(target);
    }

    function land(angle) {
      setWheelAngle(angle);
      if (wheelAnimation) wheelAnimation.cancel();
      wheelAnimation = null;
      spinning = false;

      // Whatever sits under the pointer wins, so the result is right even if the list changed mid-spin.
      const index = Math.floor(((360 - wheelAngle) % 360) / (360 / items.length));
      const winner = items[Math.min(index, items.length - 1)];
      winnerId = winner ? winner.id : null;
      renderWheel();
      if (winner) {
        celebrate();
        resultEl.scrollIntoView({ block: 'nearest', behavior: reducedMotion.matches ? 'auto' : 'smooth' });
      }
      idleTimer = setTimeout(startIdle, HOLD_MS);
    }

    // Bursts confetti out of the middle of the wheel on a throwaway full-window canvas.
    function celebrate() {
      document.querySelectorAll('.confetti').forEach(el => el.remove());
      if (reducedMotion.matches) return;

      const canvas = document.createElement('canvas');
      canvas.className = 'confetti';
      const ratio = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      document.body.append(canvas);
      const ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);

      const box = wheelEl.querySelector('svg').getBoundingClientRect();
      const originX = box.left + box.width / 2;
      const originY = Math.min(Math.max(box.top + box.height / 2, window.innerHeight * 0.2), window.innerHeight * 0.7);
      const pieces = Array.from({ length: CONFETTI_COUNT }, () => {
        const direction = Math.random() * 2 * Math.PI;
        const speed = 3 + Math.random() * 11;
        return {
          x: originX,
          y: originY,
          vx: Math.cos(direction) * speed,
          vy: Math.sin(direction) * speed - 6,
          size: 6 + Math.random() * 7,
          tilt: Math.random() * Math.PI,
          twirl: (Math.random() - 0.5) * 0.5,
          color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        };
      });

      const started = performance.now();
      let previous = started;
      function frame(now) {
        const elapsed = now - started;
        if (elapsed >= CONFETTI_MS || !canvas.isConnected) {
          canvas.remove();
          return;
        }
        const ticks = Math.min((now - previous) / 16.7, 3);
        previous = now;
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.globalAlpha = Math.min(1, (CONFETTI_MS - elapsed) / 700);
        for (const piece of pieces) {
          piece.vy += 0.28 * ticks;
          piece.vx *= 0.985 ** ticks;
          piece.x += piece.vx * ticks;
          piece.y += piece.vy * ticks;
          piece.tilt += piece.twirl * ticks;
          ctx.save();
          ctx.translate(piece.x, piece.y);
          ctx.rotate(piece.tilt);
          ctx.fillStyle = piece.color;
          ctx.fillRect(-piece.size / 2, -piece.size / 4, piece.size, piece.size / 2);
          ctx.restore();
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function render() {
      listEl.replaceChildren(...items.map(renderItem));
      emptyEl.hidden = items.length > 0;
      renderWheel();
      const editInput = listEl.querySelector('li form input');
      if (editInput) {
        editInput.focus();
        editInput.select();
      }
    }

    function startEditing(id) {
      editingId = id;
      showError('');
      render();
    }

    function stopEditing() {
      editingId = null;
      showError('');
      render();
    }

    function remove(id) {
      items = items.filter(item => item.id !== id);
      if (editingId === id) editingId = null;
      save();
      render();
    }

    addForm.addEventListener('submit', event => {
      event.preventDefault();
      const text = validate(addInput.value);
      if (text === null) return;
      items.unshift({ id: newId(), text });
      save();
      addInput.value = '';
      render();
      addInput.focus();
    });

    // Keep other open tabs of this page in step.
    window.addEventListener('storage', event => {
      if (event.key !== STORAGE_KEY && event.key !== null) return;
      items = load();
      if (!items.some(item => item.id === editingId)) editingId = null;
      render();
    });

    spinButton.addEventListener('click', spinWheel);

    render();
    startIdle();
  </script>
</body>
</html>
